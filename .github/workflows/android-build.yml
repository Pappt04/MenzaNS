name: Android Build & Test

on:
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'MenzaNS-app/**'
      - '.github/workflows/android-build.yml'
  push:
    branches: [ master, develop ]
    paths:
      - 'MenzaNS-app/**'
      - '.github/workflows/android-build.yml'

defaults:
  run:
    working-directory: ./MenzaNS-app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: './MenzaNS-app/gradle/wrapper/gradle-wrapper.properties'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Generate test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Test Results
          path: 'MenzaNS-app/app/build/test-results/testDebugUnitTest/**/*.xml'
          reporter: 'java-junit'
          fail-on-error: false

      - name: Run linting
        run: ./gradlew lint --continue

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            MenzaNS-app/app/build/reports/
            MenzaNS-app/app/build/outputs/

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testResultsPath = './MenzaNS-app/app/build/test-results/testDebugUnitTest/';
            let testsPassed = false;
            let buildStatus = 'unknown';

            // Check if test results exist
            if (fs.existsSync(testResultsPath)) {
              const files = fs.readdirSync(testResultsPath, { recursive: true });
              testsPassed = files.some(f => f.endsWith('.xml'));
            }

            const comment = `## Build Report

- **Build**: ${{ job.status }}
- **Tests**: ${testsPassed ? '✅ Passed' : '❌ No results found'}
- **Commit**: ${context.payload.pull_request?.head.sha.substring(0, 7) || 'N/A'}

[View full workflow run](${context.payload.pull_request?.head.repo.html_url}/actions/runs/${context.runId})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
